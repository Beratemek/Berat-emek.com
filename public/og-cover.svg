    <path d="M 0 200 L 1200 200"/>
    <path d="M 0 300 L 1200 300"/>
    <path d="M 0 400 L 1200 400"/>
    <path d="M 0 500 L 1200 500"/>
    <path d="M 100 0 L 100 630"/>
    <path d="M 300 0 L 300 630"/>
    <path d="M 500 0 L 500 630"/>
    <path d="M 700 0 L 700 630"/>
    <path d="M 900 0 L 900 630"/>
    <path d="M 1100 0 L 1100 630"/>
  </g>

  <text x="80" y="240" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="100" fill="#fff" letter-spacing="-3">
