  <rect x="80" y="270" width="100" height="6" fill="url(#accent)" rx="3"/>

  <text x="80" y="340" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="38" fill="#e0d4ff" letter-spacing="-0.5">
